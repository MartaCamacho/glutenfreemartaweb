name: Refresh Instagram token

# Instagram tokens die 60 days after they are issued. Refreshing monthly keeps
# the home page feed alive without anyone remembering to do it.
on:
  schedule:
    - cron: "0 4 1 * *"
  workflow_dispatch:

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/instagram-token.mjs rotate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
